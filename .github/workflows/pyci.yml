name: Python CI

on:
  - push
  - pull_request

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
        # make depends on uv
      - name: Install dependencies
        run: |
          pip install uv
          make install
      - name: Run migrations
        run: |
          make migrate
      - name: Run linter and pytest
        run: |
          make check
      - name: SonarQubeScan
        uses: SonarSource/sonarqube-scan-action@v5@2f77a1ec69fb1d595b06f35ab27e97605bdef703
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=YurasovAleksey_python-project-52
            -Dsonar.organization=yurasov
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/tests.py